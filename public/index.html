    <!-- JSON‑LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sofia Varelli",
      "url": "https://sofiavarelli.com",
      "logo": "https://sofiavarelli.com/logo.png",
      "sameAs": [
        "https://twitter.com/sofiavarelli",
        "https://instagram.com/sofiavarelli"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sofia Varelli",
      "url": "https://sofiavarelli.com",
      "sameAs": [
        "https://twitter.com/sofiavarelli",
        "https://instagram.com/sofiavarelli"
      ],
      "jobTitle": "Creator",
      "image": "https://sofiavarelli.com/sofia-avatar.jpg"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sofia Varelli Official Fan Site",
      "url": "https://sofiavarelli.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sofiavarelli.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What kind of content does Sofia Varelli post?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Exclusive photos, videos, behind‑the‑scenes content, and personal messages. New content is added weekly."
          }
        },
        {
          "@type": "Question",
          "name": "How do I subscribe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Click the 'JOIN SOFIA' button, choose a plan (monthly, 3‑month, or 6‑month), and complete payment securely via CCBill."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel my subscription?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you can cancel at any time from your account settings. Cancellations take effect at the end of the current billing period."
          }
        },
        {
          "@type": "Question",
          "name": "Is my payment information secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All payments are processed by CCBill, a PCI‑compliant processor. We do not store your credit card details."
          }
        },
        {
          "@type": "Question",
          "name": "Can I message Sofia directly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, subscribers can send private messages to Sofia and may receive personal replies, sometimes with exclusive locked media."
          }
        }
      ]
    }
    </script>

    <style>
